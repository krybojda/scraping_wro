name: CI - Full System Check (Syntax & Smoke Test)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  scripts-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      # 1. ŚRODOWISKO PYTHON
      - name: Instalacja Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          # Instalujemy to, czego używają Twoje skrypty
          pip install pandas requests beautifulsoup4 fake-useragent

      # 2. SPRAWDZANIE SKŁADNI (LINTING)
      - name: 🐍 Sprawdzanie składni Python
        run: |
          python -m compileall .

      - name: 🐚 Sprawdzanie składni Bash (ShellCheck)
        run: |
          sudo apt-get install -y shellcheck
          # Sprawdzamy tylko jeśli pliki istnieją
          [ -f run_rpi.sh ] && shellcheck run_rpi.sh
          [ -f run_vps.sh ] && shellcheck run_vps.sh || true

      - name: 🔍 Debug run_vps.sh
        run: |
          echo "===== run_vps.sh (z numerami linii) ====="
          nl -ba run_vps.sh | sed -n '1,120p'

          echo "===== szukam << / <<< / konfliktów ====="
          grep -nE '<<|<<<|<<<<<<<|>>>>>>>' run_vps.sh || echo "Brak << w run_vps.sh"

          echo "===== bash -n run_vps.sh ====="
          bash -n run_vps.sh || echo "bash -n wykrył błąd składni"


      # 3. TESTY URUCHOMIENIOWE (SMOKE TESTS)
      - name: 🧪 Testowe odpalenie skryptów .sh
        shell: bash
        run: |
          # WYŁĄCZAMY -e, bo timeout (124) jest u nas OK
          set +e

          # Nadajemy uprawnienia wykonywania
          chmod +x run_rpi.sh run_vps.sh

          # Konfigurujemy fałszywego Gita (żeby commit w skrypcie nie krzyczał o brak e-maila)
          git config --global user.email "test@bot.com"
          git config --global user.name "Test Bot"

          # Ustawiamy zmienne środowiskowe, żeby Python działał błyskawicznie (1 strona)
          export MAX_PAGES=1
          export MAX_EXECUTION_TIME=30
          export OUTPUT_FILE="test_smoke.csv"

          echo "---------------------------------------------------"
          echo "▶️ TEST 1: Odpalam run_rpi.sh (Limit 20s)..."

          timeout 20s ./run_rpi.sh
          code=$?

          if [ "$code" -eq 124 ]; then
            echo "✅ run_rpi.sh działał stabilnie i został zatrzymany przez timeout."
          elif [ "$code" -eq 0 ]; then
            echo "✅ run_rpi.sh zakończył pracę poprawnie przed czasem."
          else
            echo "❌ BŁĄD: run_rpi.sh wyrzucił błąd krytyczny (Exit Code: $code)"
            exit 1
          fi

          echo "---------------------------------------------------"
          echo "▶️ TEST 2: Odpalam run_vps.sh (Limit 20s)..."

          timeout 20s ./run_vps.sh
          code=$?

          if [ "$code" -eq 124 ]; then
            echo "✅ run_vps.sh działał stabilnie i został zatrzymany przez timeout."
          elif [ "$code" -eq 0 ]; then
            echo "✅ run_vps.sh zakończył pracę poprawnie przed czasem."
          else
            echo "❌ BŁĄD: run_vps.sh wyrzucił błąd krytyczny (Exit Code: $code)"
            exit 1
          fi

          # Jeśli doszliśmy tutaj, oba testy są OK
          exit 0



  docker-check:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: 🐳 Budowa Obrazu Docker
        run: docker build -t test-scraper .

      - name: 🚀 Test uruchomienia Kontenera
        run: |
          docker run --rm \
            -e MAX_PAGES=1 \
            -e MAX_EXECUTION_TIME=30 \
            -e OUTPUT_FILE="test_docker.csv" \
            test-scraper
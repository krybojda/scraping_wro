name: Scraper - GitHub Actions (Short Run)

on:
  schedule:
    - cron: '0 8 * * *' # Codziennie 8:00 rano
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Pozwala botowi zapisać plik w repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker
        run: docker build -t scraper .

      - name: Run Scraper
        # TUTAJ DEFINIUJESZ WARUNKI DLA GITHUB ACTIONS:
        run: |
          docker run --rm \
          -e MAX_EXECUTION_TIME=3300 \
          -e OUTPUT_FILE="mieszkania_gh.csv" \
          -v ${{ github.workspace }}:/app \
          scraper

      - name: Commit & Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Dodajemy i wysyłamy tylko plik dedykowany dla GitHuba
          git add mieszkania_gh.csv
          git commit -m "Auto-update danych z GitHub Actions" || echo "Brak zmian"
          git pull --rebase origin main
          git push
